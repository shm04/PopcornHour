<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Película</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <div class="upload-form-container">
    <h2>Editar Película</h2>
    <p>Modifica los detalles de la película existente</p>

    <form action="{{ url_for('edit_movie', movie_id=movie.id) }}" method="POST">
      <label>Título *</label>
      <input type="text" name="title" value="{{ movie.title }}" required>

      <label>Calificación (Rating)</label>
      <input type="number" step="0.1" name="rating" min="0" max="10" value="{{ movie.rating or '' }}">

      <div class="form-row double">
        <div>
          <label>Año *</label>
          <input type="number" name="year" value="{{ movie.year }}" required>
        </div>
        <div>
          <label>URL de la imagen *</label>
          <input type="url" name="image_url" value="{{ movie.image_url }}" required>
        </div>
      </div>

      <label>Sinopsis *</label>
      <textarea name="description" required>{{ movie.description }}</textarea>

      <div class="form-footer">
        <a href="{{ url_for('admin_dashboard') }}">
          <button type="button" class="btn">Cancelar</button>
        </a>
        <button type="submit" class="btn orange">💾 Guardar cambios</button>
      </div>
    </form>

    <form action="{{ url_for('delete_movie', movie_id=movie.id) }}" method="POST" style="margin-top: 20px;">
      <button type="submit" class="btn red" onclick="return confirm('¿Eliminar esta película?')">🗑️ Eliminar película</button>
    </form>
  </div>
</body>
</html>
