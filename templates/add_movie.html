<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Subir Nueva Película</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <div class="upload-form-container">
    <h2>Subir Nueva Película</h2>
    <p>Agrega una nueva película a la base de datos de PopcornHour</p>

    <form action="{{ url_for('add_movie') }}" method="POST">
      <label>Título de la película *</label>
      <input type="text" name="title" required>

      <label>Calificación (rating, ej. 7.5)</label>
      <input type="number" step="0.1" name="rating" min="0" max="10">

      <div class="form-row double">
        <div>
          <label>Año de estreno *</label>
          <input type="number" name="year" required>
        </div>
        <div>
          <label>URL de la imagen *</label>
          <input type="url" name="image_url" required>
        </div>
      </div>

      <label>Descripción *</label>
      <textarea name="description" required></textarea>

      <div class="form-footer">
        <a href="{{ url_for('admin_dashboard') }}">
          <button type="button" class="btn">Cancelar</button>
        </a>
        <button type="submit" class="btn orange">📤 Subir Película</button>
      </div>
    </form>
  </div>
</body>

</html>
